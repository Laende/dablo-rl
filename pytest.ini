[pytest]
# Pytest configuration for Dablo RL test suite

# Minimum version required
minversion = 8.0

# Test discovery paths
testpaths = tests

# Default command-line options
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --cov=dablo 
    --cov-report=term-missing 
    --cov-report=html:htmlcov 
    --cov-fail-under=80 

# Performance and debugging options
# --durations=10
# --showlocals
# -v

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to ignore during collection
norecursedirs = 
    .git 
    .tox 
    .pytest_cache
    __pycache__
    venv*
    env*
    node_modules 
    build 
    dist
    *.egg-info

# Marker definitions
markers =
    unit: Unit tests for individual methods and functions
    integration: Tests involving multiple components  
    slow: Tests that take longer to run (>1s)
    game_mechanics: Core game rule and logic tests
    movement: Piece movement and validation tests
    capture: Capture mechanics and chain capture tests
    endgame: Game ending conditions and win detection
    npc_performance: NPC AI performance benchmarking tests
    performance: Performance and benchmarking tests
    ui: User interface and user experience tests

# Warning filters
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning:.*pkg_resources.*
    ignore::pytest.PytestUnraisableExceptionWarning

# Console output formatting
console_output_style = progress

# Test session timeout (in seconds)
# timeout = 300

# Parallel execution (requires pytest-xdist)
# addopts = -n auto

# Coverage reporting (requires pytest-cov)
# addopts = --cov=dablo --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=80